# Data layer CI (spec v1.1 §14 "CI wiring").
#
#   Tier 1 (offline)  gates every push. No database: it reads SQLAlchemy
#                     metadata and Alembic migration source, so it finishes in
#                     about a second and can never be "temporarily skipped
#                     because the database was down".
#   Tier 2 (online)   runs on main, and on pull requests that touch schema,
#                     migrations, studium.privacy or studium.cost.
#
# Tier 2 provisions its database from backend/docker-compose.test.yml rather
# than a `services:` block, so CI and a developer's laptop run byte-identical
# Postgres: same pinned image, same init script, same three databases.

name: data layer

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: data-layer-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

env:
  PYTHON_VERSION: "3.12"

  # Branches that get the full Tier 2 run on every push, space separated.
  #
  # §14 says "the main branch". That is a stand-in for "wherever work actually
  # integrates", and here it does not integrate on main: pushing to main is not
  # available, so `yannis` is the trunk in practice and every commit lands
  # there. Gating Tier 2 on a branch nothing reaches would mean the online tier
  # never ran at all -- the failure the tiering exists to prevent.
  #
  # The consequence is deliberate: every push to an integration branch pays for
  # a Postgres spin-up, including doc-only pushes. At this project's commit rate
  # that is a couple of CI minutes against the alternative of a schema
  # regression reaching the next subsystem unnoticed. If the cost ever bites,
  # narrow it by adding the same path filter the pull-request branch below uses
  # rather than by removing a branch from this list.
  INTEGRATION_BRANCHES: "main yannis"

  # Ruff is scoped to subsystem 1 deliberately, not for convenience.
  #
  # The working tree also contains subsystem 2 material -- studium/llm,
  # studium/orchestration, studium/agents, studium/api, studium/asyncdb.py and
  # others -- which has not been through the build-and-review cycle that
  # produced everything listed here. Linting it would make a green run claim
  # those files are reviewed when they are not, which is a worse failure than
  # not checking them: this workflow certifies subsystem 1, and it should
  # certify exactly that and nothing more.
  #
  # Subsystem 2 is now covered by .github/workflows/agent-runtime.yml, which
  # lints and tests exactly those paths. Kept as a second workflow rather than
  # folded in here, for the reason this comment already gives: one green check
  # spanning both subsystems cannot tell you which of them is healthy. Two
  # workflows, two claims, each falsifiable on its own.
  #
  # studium/review stays out of this list for the same reason it always did:
  # it imports studium.llm.prompts and so belongs to subsystem 2's set.
  RUFF_PATHS: >-
    studium/__init__.py studium/acl.py studium/assessment.py
    studium/config.py studium/cost.py studium/db.py studium/graph.py
    studium/mastery.py studium/privacy.py studium/queries.py
    studium/models studium/jobs tests/schema tests/unit tests/integrity
    tests/queries tests/migrations tests/fixtures tests/conftest.py
    tests/dbprobe.py scripts

  # Same scoping, same reason: tests/llm, tests/agents, tests/orchestration,
  # tests/session, tests/api and tests/online are subsystem 2's and run under
  # agent-runtime.yml, not this gate.
  TEST_PATHS: >-
    tests/schema tests/unit tests/integrity tests/queries tests/migrations

jobs:
  offline:
    name: Tier 1 - offline
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        # Scope is RUFF_PATHS, set at the top of this file with the reasoning.
        run: python -m ruff check ${{ env.RUFF_PATHS }}

      - name: Tier 1
        # -m "not postgres" must deselect, never silently pass an empty set.
        run: python -m pytest ${{ env.TEST_PATHS }} -q -m "not postgres"

  changes:
    name: Does Tier 2 apply?
    runs-on: ubuntu-24.04
    outputs:
      run_online: ${{ steps.decide.outputs.run_online }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: decide
        name: Decide
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          INTEGRATION_BRANCHES: ${{ env.INTEGRATION_BRANCHES }}
        run: |
          set -euo pipefail
          # §14: "Tier 2 runs on the main branch and on pull requests that
          # touch schema, migrations, or the studium.privacy and studium.cost
          # modules."
          #
          # Read as intent rather than as the literal word "main": Tier 2 runs
          # on every push to whichever branch work actually integrates on, and
          # on PRs that touch schema-adjacent paths. INTEGRATION_BRANCHES is
          # that first set -- see the note at the top of this file.
          if [ "$EVENT" != "pull_request" ]; then
            branch="${REF#refs/heads/}"
            for candidate in $INTEGRATION_BRANCHES; do
              if [ "$branch" = "$candidate" ]; then
                echo "run_online=true" >> "$GITHUB_OUTPUT"
                echo "$branch is an integration branch: Tier 2 runs"
                exit 0
              fi
            done
            echo "run_online=false" >> "$GITHUB_OUTPUT"
            echo "$branch is not an integration branch: Tier 1 only"
            exit 0
          fi

          changed=$(git diff --name-only "$BASE_SHA" HEAD)
          echo "changed files:"; echo "$changed" | sed 's/^/  /'

          if echo "$changed" | grep -qE '^backend/(studium/models/|migrations/|studium/privacy\.py|studium/cost\.py)'; then
            echo "run_online=true" >> "$GITHUB_OUTPUT"
            echo "touches schema/migrations/privacy/cost: Tier 2 runs"
          else
            echo "run_online=false" >> "$GITHUB_OUTPUT"
            echo "no schema-adjacent changes: Tier 1 only"
          fi

  online:
    name: Tier 2 - online
    needs: [offline, changes]
    if: needs.changes.outputs.run_online == 'true'
    runs-on: ubuntu-24.04
    env:
      STUDIUM_TEST_DATABASE_URL: postgresql+psycopg://studium:studium@localhost:5433/studium_test
      STUDIUM_MIGRATION_TEST_DATABASE_URL: postgresql+psycopg://studium:studium@localhost:5433/studium_migrate
      STUDIUM_DATABASE_URL: postgresql+psycopg://studium:studium@localhost:5433/studium_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Check pg_dump
        # §13 check 3 shells out to pg_dump. The test skips when it is absent,
        # which in CI would mean the reversibility check quietly stops running
        # -- so assert it is present and matches the server major version.
        run: |
          set -euo pipefail
          version=$(pg_dump --version | grep -oE '[0-9]+' | head -1)
          echo "pg_dump major version: $version"
          test "$version" = "16" || {
            echo "::error::pg_dump $version does not match Postgres 16"
            exit 1
          }

      - name: Start Postgres
        run: docker compose -f docker-compose.test.yml up -d test-db

      - name: Wait for health
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if docker compose -f docker-compose.test.yml exec -T test-db \
                 pg_isready -U studium -d studium_test >/dev/null 2>&1; then
              echo "ready"; exit 0
            fi
            sleep 2
          done
          echo "::error::Postgres did not become ready"
          docker compose -f docker-compose.test.yml logs test-db
          exit 1

      - name: Verify extensions
        # A pgvector-less image would fail every test with an unhelpful error
        # at migration 0001. Fail here instead, where the cause is legible.
        run: |
          docker compose -f docker-compose.test.yml exec -T test-db \
            psql -U studium -d studium_test -tAc \
            "SELECT name FROM pg_available_extensions
              WHERE name IN ('vector','citext','pg_trgm','pgcrypto') ORDER BY 1" \
            | tee /tmp/ext.txt
          test "$(wc -l < /tmp/ext.txt)" -eq 4 || {
            echo "::error::missing required extensions"; exit 1; }

      - name: Apply schema
        # The integrity and query tiers expect the schema already at head.
        run: python -m alembic upgrade head

      - name: Tier 2
        run: python -m pytest ${{ env.TEST_PATHS }} -q -m postgres

      - name: Postgres logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs test-db

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
