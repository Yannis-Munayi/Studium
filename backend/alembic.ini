[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Spec section 13: NNNN_verb_object.py
file_template = %%(rev)s_%%(slug)s

# The URL is set from studium.config in migrations/env.py so that the app and
# the migrations always read the same environment variable.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
