[project]
name = "studium-backend"
version = "1.0.0"
description = "Studium data layer and agent runtime (spec subsystems 1 and 2)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2.5",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # Agent runtime (subsystem 2 §4). 0.40 is the spec's floor; messages.parse
    # with output_format -- the structured-output path every non-streaming
    # agent method uses -- needs a good deal newer than that.
    "anthropic>=0.60",
    "fastapi>=0.110",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-randomly",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    # TestClient for the API tier.
    "httpx>=0.27",
]
# Langfuse is optional at runtime (§22): absent or unconfigured, every tracing
# hook is a no-op. Observability must not be able to fail a learner's turn.
observability = ["langfuse>=2.0"]
serve = ["uvicorn[standard]>=0.29"]
# Retrieval (subsystem 3 §4). Optional at runtime: without it, chunking falls
# back to a character-ratio token estimate and the retriever runs on stub
# embeddings, which is enough for Tier 1 and Tier 2 but not for a deployment.
# studium.retrieval.default_retriever warns when it takes that path.
retrieval = ["voyageai>=0.2"]

# Flat layout: without this, setuptools sees studium/, tests/, scripts/ and
# migrations/ as candidate packages and refuses to guess. Only studium ships.
[tool.setuptools.packages.find]
include = ["studium*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "postgres: requires a live Postgres 16 with the schema applied",
    # Also carries retrieval's paid tier (Voyage). One paid marker rather than
    # two: every CI workflow already deselects this one, and a second would
    # need each of them updated to stay excluded -- the one that got missed
    # would start billing.
    "anthropic: requires a live model/embedding API key and spends real money",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# B008 flags function calls in argument defaults. Depends() in a signature
# default is FastAPI's dependency-injection idiom, not the mutable-default bug
# the rule exists to catch.
"studium/api/*.py" = ["B008"]
