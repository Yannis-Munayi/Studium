  - key: topic:computability_theory_and_calculus
    summary:
      name: Computability theory and λ calculus
      oneliner: 'Foundations: Turing machines, recursive functions, and λ calculus
        equivalence and roles.'
      short: Three equivalent formal models of computation; λ calculus suitable for
        modelling functional languages and semantics.
      long: 'Explains 1936 developments: Turing machines, Kleene''s recursive function
        theory, and Church''s λ calculus. These models are equivalent (Church''s thesis)
        and match von Neumann machines. Differences: Turing model emphasises mechanised
        symbol manipulation and ordered evaluation; λ calculus and recursive functions
        emphasise structured function application and order independence. Church-Rosser
        confluence and undecidability (halting) are discussed. λ calculus serves as
        universal machine code for programming languages and for semantic descriptions
        (operational & denotational).'
    entities:
    - key: definition:calculus_role_in_programming_languages
      kind: definition
      summary:
        name: λ calculus role in programming languages
        oneliner: λ calculus as a basis for functional language design and semantics.
        short: Abstraction and application suffice to represent programming constructs;
          λ calculus is evaluation-order independent and easy to implement for prototyping
          languages.
        long: States that abstraction ($\lambda$-abstraction) and application are
          the primitive operations of λ calculus and can represent arbitrary language
          constructs. Because of confluence and simplicity, λ calculus is well-suited
          to describe evaluation orders, semantics (operational and denotational),
          and to prototype language designs.
      fact_kind: null
      related_to:
      - type: is_a
        target_key: concept:calculus
