      kind: other
      summary:
        name: Motivation for using λ calculus in the book
        oneliner: Use λ calculus to stepwise construct a compact functional notation
          and implementations.
        short: Pure λ calculus expanded with representations for pairs, booleans,
          numbers, recursion, types, lists, trees, and evaluation strategies.
        long: 'Explains pedagogical plan: start from pure λ calculus (names, abstraction,
          application), develop encodings for pairs, booleans, numbers, recursion
          (fixpoints), types, lists, trees, discuss evaluation order and termination,
          then map techniques to Standard ML and LISP.'
