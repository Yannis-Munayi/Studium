  - key: topic:calculus_lambda_calculus
    summary:
      name: λ calculus (lambda calculus)
      oneliner: Introduction to λ calculus as a compact formal system based on abstraction
        and application.
      short: Highlights simplicity, power, properties useful for language description,
        and use in later chapters.
      long: 'Describes λ calculus as a simple yet powerful formal system using names,
        function abstraction ($\lambda$-abstraction) and application. Notes properties:
        sufficient to encode language constructs, evaluation-order independence (confluence),
        well-developed proof techniques, and ease of implementation. The book will
        build a practical functional notation from λ calculus in subsequent chapters.'
