concepts:
  concept:functional_programming:
    key: concept:functional_programming
    summary:
      name: Functional programming
      oneliner: Programming paradigm based on function calls and immutability.
      short: An approach to programming where computation is expressed by composing
        and evaluating functions; names are bound once and there is no assignment.
      long: Functional programming is a programming paradigm in which function application
        and function composition are the primary building blocks. Names (formal parameters)
        are bound to values by function calls and are not reassigned; there is no
        assignment statement or mutable variables in the pure form. Repetition is
        achieved by recursion rather than loops, data structures are treated as whole
        values (immutable), and functions are first-class values that can be passed
        and returned. The paradigm highlights evaluation-order independence and a
        close connection with the λ (lambda) calculus and recursive function theory.
    introduced_by: chunk:gjm_lambda_book--1_introduction
  concept:imperative_programming:
    key: concept:imperative_programming
    summary:
      name: Imperative programming
      oneliner: Programming style based on commands, mutable variables and assignment.
      short: An approach to programming consisting of sequences of commands that change
        program state via assignment to variables; execution order is crucial.
      long: Imperative programming models computation as sequences of commands (statements)
        that update mutable state. Variables (names) represent changeable associations
        to values and assignment (<name> := <expression>) modifies those associations.
        Control structures (loops, conditionals) describe command sequencing; execution
        order matters because commands can alter shared state. Examples include Pascal,
        FORTRAN and COBOL.
    introduced_by: chunk:gjm_lambda_book--1_introduction
  concept:calculus:
    key: concept:calculus
    summary:
      name: λ calculus
      oneliner: Minimal formal system using abstraction and application to model computation.
      short: A simple but powerful formal system based on function abstraction ($\lambda$-abstraction)
        and function application, used as a foundation for functional programming
        and semantics.
      long: The λ calculus is a formal system whose syntax and computation rules are
        built from variable names, function abstraction ($\lambda x.\,E$) and application
        ($E_1\,E_2$). It can encode data and control structures and serves as a universal
        model for computation equivalent to Turing machines and recursive functions.
        Important properties include evaluation-order independence, the Church–Rosser
        confluence property, and its use as a basis for language design, operational
        and denotational semantics, and implementations (e.g. via the SECD machine).
        Representations for booleans, numbers, pairs and lists are developed from
        the λ calculus.
    introduced_by: chunk:gjm_lambda_book--1_introduction
  concept:names_and_values:
    key: concept:names_and_values
    summary:
      name: Names and values
      oneliner: How names are associated with values in programs; differing rules
        in paradigms.
      short: Concept of using names to stand for values in programs; in imperative
        languages names can be reassigned, while in functional languages names (formal
        parameters) are bound once by calls and immutable.
      long: Names (identifiers) are program-level references to values. Imperative
        languages use variables as changeable associations between a name and successive
        values via assignment. Functional languages introduce names only as formal
        parameters for functions; once bound to actual parameter values they are not
        reassigned. This distinction underpins differences in execution order sensitivity,
        repetition mechanisms, and data-structure manipulation.
    introduced_by: chunk:gjm_lambda_book--1_introduction
  concept:evaluation_order:
    key: concept:evaluation_order
    summary:
      name: Evaluation order
      oneliner: Order in which expressions/commands are evaluated and its effect on
        results.
      short: 'The sequencing of evaluation (execution order): imperative languages
        depend on a fixed command order, while pure functional languages are evaluation-order
        independent (different orders yield the same result when they terminate).'
      long: 'Evaluation order refers to the sequence in which expressions or commands
        are evaluated. Imperative programs rely on a fixed ordering because assignments
        change shared state. Pure functional programs, where functions cannot change
        shared names, are evaluation-order independent: rearranging the order of independent
        function calls does not affect final results. λ calculus has confluence properties
        (Church–Rosser) guaranteeing that if different reduction orders terminate,
        they produce the same normal form; some orders are more likely to terminate
        (e.g., normal order).'
    introduced_by: chunk:gjm_lambda_book--1_introduction
  concept:recursion:
    key: concept:recursion
    summary:
      name: Recursion
      oneliner: Function calls that reference themselves to express repetition.
      short: Technique for repetition in functional programming where a function calls
        itself with updated parameters to produce iterative behaviour without assignment.
      long: 'Recursion is the mechanism by which repetition and iterative computation
        are expressed in functional languages: a function invokes itself with new
        arguments to progress toward a base case. Each recursive call creates new
        local bindings; previous activations become inaccessible until results are
        returned. Recursive definitions correspond closely to mathematical induction
        and primitives in recursive function theory. Recursion replaces imperative
        loops in pure functional code (example: summing array elements via SUM(A,I,N)
        calling SUM(A,I+1,N)).'
    introduced_by: chunk:gjm_lambda_book--1_introduction
  concept:data_structures_lists_vs_arrays:
    key: concept:data_structures_lists_vs_arrays
    summary:
      name: Data structures (lists vs arrays)
      oneliner: Representation and manipulation of structured values in functional
        languages, favouring immutable lists over mutable arrays.
      short: Functional languages favour immutable nested structures like lists; arrays
        requiring in-place updates are awkward without assignment. Lists are recursively
        defined and align with function recursive processing.
      long: Because pure functional languages lack assignment, modifying parts of
        large structures by destructive updates is not available. Instead entire structures
        are constructed with desired changes; nested recursive data (lists, trees)
        are natural and efficiently processed by recursive functions. Lists provide
        a standard, uniform representation (as in LISP) for both data and code, simplifying
        printing, I/O, and program-manipulation. Arrays and destructive updates are
        an imperative facility and are not primary in pure functional style.
    introduced_by: chunk:gjm_lambda_book--1_introduction
  concept:functions_as_values_higher_order_functions:
    key: concept:functions_as_values_higher_order_functions
    summary:
      name: Functions as values (higher-order functions)
      oneliner: Functions can be passed and returned like other values, enabling higher-order
        programming.
      short: 'In functional languages functions are first-class: they can be created,
        passed as actual parameters, returned as results, and stored in data structures.'
      long: 'Higher-order functions treat functions as data: functions may construct
        new functions, return them as results, or accept them as arguments. This enables
        powerful abstraction mechanisms (e.g., ARITH(OP) returning an arithmetic function
        such that ARITH(ADD)(3,4) computes 7). Many imperative languages allow passing
        subroutines but do not treat subprograms uniformly as first-class values.'
    introduced_by: chunk:gjm_lambda_book--1_introduction
  concept:lisp:
    key: concept:lisp
    summary:
      name: LISP
      oneliner: An early list-processing language influenced by λ calculus and recursion.
      short: LISP is an early high-level language based on list processing, with minimal
        syntax, programs-as-data (code is a list), and both functional and imperative
        features; influential in AI and functional language design.
      long: LISP (LISt Processing) was developed by McCarthy and is based on recursive
        functions that operate on lists of symbols and numbers. Variables are untyped,
        programs are represented as lists (enabling program manipulation), and the
        language mixes functional and imperative features. LISP influenced many later
        functional languages and implementations; dialects include COMMON LISP.
    introduced_by: chunk:gjm_lambda_book--1_introduction
  concept:computability_theory:
    key: concept:computability_theory
    summary:
      name: Computability theory
      oneliner: Formal study of what can be computed (Turing, Church, Kleene).
      short: Field studying formal models of computation (Turing machines, recursive
        functions, λ calculus), their equivalence, and limits like undecidability.
      long: Computability theory developed formalizations of computation—Turing machines,
        Kleene's recursive functions, and Church's λ calculus—showing their equivalence
        and providing a foundation for reasoning about algorithms and languages. It
        addresses decidability and undecidability results (e.g., the halting problem)
        and motivates semantic descriptions and language design. Church's thesis (informal)
        posits that these formalizations capture all effectively computable functions.
    introduced_by: chunk:gjm_lambda_book--1_introduction
  concept:types:
    key: concept:types
    summary:
      name: Types
      oneliner: Classification of program values into categories that restrict valid
        operations and enable static or dynamic checking.
      short: Types specify classes of objects (e.g. booleans, numbers, characters)
        and the operations valid on them; they can be introduced to ensure meaningful
        argument use and to allow either dynamic or static checking.
      long: 'A type is presented as a specification of a class of objects together
        with the operations defined on them. The document explains types both extensionally
        (by listing values, e.g. TRUE/FALSE for booleans) and inductively/constructively
        (e.g. numbers: 0 and SUCC N). Types are used to:

        - control use of operations so only meaningful combinations occur;

        - define predicates and operations by case (exhaustive enumeration) or constructive
        recursion.

        The chapter contrasts weakly typed systems (runtime object tags, variables
        untyped) and strongly typed systems (variables declared with types), and distinguishes
        dynamic (runtime) checking from static (compile-time) checking. It also shows
        how typed functions can be layered on top of untyped lambda-style representations
        by encoding typed objects and performing explicit checks.'
    introduced_by: chunk:gjm_lambda_book--5_types
  concept:type_checking:
    key: concept:type_checking
    summary:
      name: Type checking
      oneliner: Mechanisms and trade-offs for verifying that program operands match
        expected types, either at run time (dynamic) or before execution (static).
      short: Describes dynamic (per-operation runtime checks leading to error objects)
        versus static (symbolic/compile-time) checking, and the performance cost of
        repetitive runtime checks in pure typed function compositions.
      long: The document explains dynamic type checking implemented by each typed
        operation testing its arguments' types at runtime and returning error objects
        on mismatch. It highlights the inefficiency of repetitive runtime checks in
        layered typed definitions (many nested IF/ISNUMB/ISZERO checks during recursion)
        and contrasts this with static type checking where consistency is validated
        before execution, eliminating redundant runtime checks. Examples show how
        an outer check can guard an auxiliary recursive routine to avoid repeated
        checks, but also note that symbolic/static checking is needed to be confident
        in large programs.
    introduced_by: chunk:gjm_lambda_book--5_types
  concept:typed_objects_type_value_pairs:
    key: concept:typed_objects_type_value_pairs
    summary:
      name: Typed objects (type/value pairs)
      oneliner: Representation of typed values as pairs whose first component encodes
        the type and second the untyped value.
      short: 'Defines make_obj, type and value selectors, and istype to encode typed
        objects as functions/pairs: make_obj type value = λs.(s type value); type
        obj = obj select_first; value obj = obj select_second.'
      long: 'The document presents an encoding of typed objects on top of an untyped
        lambda-style core by representing each object as a type/value pair. The constructor
        is:

        make_obj type value = λs.(s type value)

        Selectors:

        type obj = obj select_first

        value obj = obj select_second

        A type tester is implemented numerically via:

        istype t obj = equal (type obj) t

        This representation is used uniformly for booleans, numbers, characters and
        errors, enabling typed operations to extract untyped values, perform underlying
        (untyped) computation, and wrap results back into typed objects.'
    introduced_by: chunk:gjm_lambda_book--5_types
  concept:error_objects:
    key: concept:error_objects
    summary:
      name: Error objects
      oneliner: Typed error values returned on type mismatches; encoded as objects
        of an error_type.
      short: Introduces an error_type (zero), a MAKE_ERROR constructor, a canonical
        ERROR object and conventions that operations return typed error objects (of
        the expected result type) when arguments are of incorrect types.
      long: 'The chapter defines a dedicated error type and constructors so that type
        errors are represented as first-class objects. Definitions:

        def error_type = zero

        def MAKE_ERROR = make_obj error_type

        def ERROR = MAKE_ERROR error_type

        An operation receiving an argument of the wrong type returns an error object
        corresponding to the expected result type (e.g. NUMB_ERROR, BOOL_ERROR, CHAR_ERROR),
        allowing errors to propagate as typed values and be detected by iserror tests.
        The text traces example expansions showing how ERROR has type error_type and
        value error_type.'
    introduced_by: chunk:gjm_lambda_book--5_types
  concept:boolean_type:
    key: concept:boolean_type
    summary:
      name: Boolean type
      oneliner: Typed booleans constructed and tested via the bool_type tag and MAKE_BOOL
        wrapper, with typed NOT, AND, IF and helpers.
      short: Defines bool_type, MAKE_BOOL, TRUE, FALSE, isbool/ISBOOL, BOOL_ERROR
        and typed boolean operators (NOT, AND) that check argument types, extract
        untyped boolean values, perform untyped boolean ops, and rewrap results.
      long: 'Booleans are encoded with a dedicated type tag:

        def bool_type = one

        def MAKE_BOOL = make_obj bool_type

        def TRUE = MAKE_BOOL true

        def FALSE = MAKE_BOOL false

        Type test:

        def isbool = istype bool_type

        Typed operations follow the pattern: check isbool on args, extract with value,
        apply untyped operation (not, and), and wrap result with MAKE_BOOL; otherwise
        return BOOL_ERROR. A typed conditional COND/IF is provided which returns BOOL_ERROR
        if the condition is not a boolean. The document also shows how higher-level
        boolean ops can be expressed using IF and ISBOOL to avoid explicit checks
        in every operator.'
    introduced_by: chunk:gjm_lambda_book--5_types
  concept:typed_conditional_if_then_else:
    key: concept:typed_conditional_if_then_else
    summary:
      name: Typed conditional (IF ... THEN ... ELSE ...)
      oneliner: A conditional that checks that its condition is a typed boolean and
        returns a typed boolean or BOOL_ERROR.
      short: Defines COND E1 E2 C which verifies that C is a boolean (isbool C), branches
        on its untyped value, and otherwise returns BOOL_ERROR; IF ... THEN ... ELSE
        ... is syntactic sugar for this COND form.
      long: "The typed conditional is defined to integrate type checking with control\
        \ flow:\ndef COND E1 E2 C =\n  if isbool C\n  then if value C then E1 else\
        \ E2\n  else BOOL_ERROR\nThe notation:\nIF <condition> THEN <expr1> ELSE <expr2>\n\
        is introduced as syntactic sugar for:\nCOND <expr1> <expr2> <condition>\n\
        The document also defines ISERROR and ISBOOL as typed boolean wrappers around\
        \ the untyped iserror and isbool predicates to be usable directly within IF\
        \ expressions."
    introduced_by: chunk:gjm_lambda_book--5_types
  concept:number_type:
    key: concept:number_type
    summary:
      name: Number type
      oneliner: Typed natural numbers represented with a numb_type tag and untyped
        Peano-like values as payloads; typed arithmetic wraps untyped operations.
      short: Defines numb_type, MAKE_NUMB, NUMB_ERROR, isnumb/ISNUMB, typed constructors
        for 0, SUCC, PRED, ISZERO, and typed arithmetic (+, *, /, EQUAL) that check
        arguments and operate on underlying untyped numeric values.
      long: 'Numbers are encoded similarly to booleans:

        def numb_type = two

        def MAKE_NUMB = make_obj numb_type

        def NUMB_ERROR = MAKE_ERROR numb_type

        def isnumb = istype numb_type

        def ISNUMB N = MAKE_BOOL (isnumb N)

        0 and successors:

        def 0 = MAKE_NUMB zero

        def SUCC N = if isnumb N then MAKE_NUMB (succ (value N)) else NUMB_ERROR

        Predicates and operations (PRED, ISZERO, +, *, /, EQUAL) are implemented by
        first testing argument types (both_numbs), extracting untyped numeric payloads
        (value X), invoking untyped arithmetic primitives (add, mult, div1, equal),
        and wrapping results back into typed numbers or typed booleans as appropriate,
        returning NUMB_ERROR on type failures. Example expansions show SUCC 0 -> MAKE_NUMB
        one -> typed 1.'
    introduced_by: chunk:gjm_lambda_book--5_types
  concept:character_type:
    key: concept:character_type
    summary:
      name: Character type
      oneliner: Characters encoded as typed objects whose payloads are untyped numeric
        codes (ASCII), enabling ordering and conversion to/from numbers.
      short: Defines char_type, MAKE_CHAR, CHAR_ERROR, ischar/ISCHAR, concrete character
        constructors mapping characters to numeric code values (e.g. 'A' -> sixty_five),
        and typed operations CHAR_LESS, ORD, CHAR and CHAR_EQUAL built atop numeric
        comparisons.
      long: 'Characters are introduced as a new type:

        def char_type = four

        def MAKE_CHAR = make_obj char_type

        def CHAR_ERROR = MAKE_ERROR char_type

        def ischar = istype char_type

        Characters are represented by mapping to untyped numeric ASCII codes stored
        as the object''s payload, e.g.:

        def ''0'' = MAKE_CHAR forty_eight

        def ''A'' = MAKE_CHAR sixty_five

        Conversions and comparisons leverage numeric operations:

        def ORD C = if ischar C then MAKE_NUMB (value C) else CHAR_ERROR

        def CHAR N = if isnumb N then MAKE_CHAR (value N) else NUMB_ERROR

        def CHAR_LESS C1 C2 = if and (ischar C1) (ischar C2) then MAKE_BOOL (less
        (value C1) (value C2)) else CHAR_ERROR

        This allows lexicographic ordering and equality checks via underlying numeric
        order/equality.'
    introduced_by: chunk:gjm_lambda_book--5_types
  concept:infix_operators:
    key: concept:infix_operators
    summary:
      name: Infix operators
      oneliner: Notation allowing binary operator names to appear between their operands,
        as syntactic sugar for prefix application.
      short: Introduces strict infix notation where <expr1> + <expr2> is syntax for
        + <expr1> <expr2>; no precedence or implicit associativity is assumed (explicit
        bracketing required).
      long: 'The document permits using certain binary function names as infix operators
        for readability:

        <expression1> AND <expression2>  == AND <expression1> <expression2>

        <expression1> + <expression2>    == + <expression1> <expression2>

        etc.

        To avoid ambiguity, operator precedence and associativity are not introduced:
        nested infix expressions require explicit parentheses, e.g. 7 + (8 * 9). This
        is offered as syntactic sugar only, not changing semantics beyond notation.'
    introduced_by: chunk:gjm_lambda_book--5_types
  concept:case_definitions_and_structure_matching:
    key: concept:case_definitions_and_structure_matching
    summary:
      name: Case definitions and structure matching
      oneliner: Syntax and semantics for multi-case function definitions that match
        argument structure or constructors to select the appropriate case.
      short: Introduces pattern-style definitions (e.g., def NOT TRUE = FALSE or rec
        POWER X 0 = 1) where arguments are matched against patterns from first to
        last; when matched, bound variables are instantiated to substructures. This
        simplifies writing definitions for booleans and inductive types like numbers.
      long: 'The chapter extends the function definition notation to allow multiple
        cases written as patterns, enabling direct structure matching:

        def <name> <pattern1> = <expr1>

        or <name> <pattern2> = <expr2>

        ...

        Patterns may include constants (TRUE, FALSE, 0) and constructors (SUCC), so
        numeric recursion can be written as:

        rec POWER X 0 = 1

        or POWER X (SUCC Y) = X * (POWER X Y)

        Matching is attempted in order; on a successful match the corresponding case''s
        variables are bound to matched substructures for use in the right-hand side.
        This replaces many explicit IF/ISZERO branching constructs and selects cases
        by structure rather than by nested conditionals.'
    introduced_by: chunk:gjm_lambda_book--5_types
  concept:static_and_dynamic_typing:
    key: concept:static_and_dynamic_typing
    summary:
      name: Static and dynamic typing
      oneliner: Comparison of runtime (dynamic) type checking versus compile-time
        (static) type checking and their implications for runtime overhead and program
        safety.
      short: Explains dynamic checking (every operation ensures its operands' types
        at runtime) and static checking (symbolic/type-system verification before
        execution), notes trade-offs in efficiency and error detection, and situates
        their analogies to languages like LISP/Prolog (dynamic) and ML/Pascal (static).
      long: 'The document contrasts two approaches:

        - Dynamic typing/checking: operations test operand types at runtime and return
        typed error objects on mismatch. This is analogous to LISP/Prolog and leads
        to repetitive checks and runtime overhead.

        - Static typing/checking: types are part of the language syntax or inferred;
        consistency is verified before execution (as in ML, Pascal), removing the
        need for runtime checks and improving performance and early error detection.

        Examples (e.g., repeated ISNUMB/ISZERO checks in ADD/ADD1) illustrate the
        inefficiency of purely dynamic checking in deeply recursive or composed operations.
        The discussion motivates when and why static checking is preferable and mentions
        languages that provide type inference or declarations.'
    introduced_by: chunk:gjm_lambda_book--5_types
highlights:
  chunk:gjm_lambda_book--1_introduction:
  - text: Explain how functional programming treats names as single, immutable associations
      and how this contrasts with imperative variable assignment.
    concepts:
    - concept:functional_programming
    - concept:variable_assignment
    reference_id: chunk:gjm_lambda_book--1_introduction
  - text: Describe recursion and nested function calls as the mechanism for repetition
      and state evolution in functional programs (replacing loops and reassignment).
    concepts:
    - concept:recursion
    reference_id: chunk:gjm_lambda_book--1_introduction
  - text: 'Understand first-class functions: functions can be constructed, returned
      and passed as values.'
    concepts:
    - concept:first_class_functions
    reference_id: chunk:gjm_lambda_book--1_introduction
  - text: Summarise the $λ$-calculus as a minimal formal system (abstraction and application)
      that can represent programming constructs and reason about evaluation.
    concepts:
    - concept:lambda_calculus
    reference_id: chunk:gjm_lambda_book--1_introduction
  - text: Explain evaluation-order independence, Church–Rosser confluence, and the
      relation between evaluation order and termination/efficiency.
    concepts:
    - concept:evaluation_order
    - concept:confluence_church_rosser
    reference_id: chunk:gjm_lambda_book--1_introduction
  - text: Relate theoretical models (Turing machines, recursive functions, $λ$-calculus)
      to language design and semantics (operational and denotational), and survey
      historically important functional languages.
    concepts:
    - concept:denotational_semantics
    - concept:operational_semantics
    reference_id: chunk:gjm_lambda_book--1_introduction
  chunk:gjm_lambda_book--2_lambda_calculus:
  - text: Explain and apply the notion of abstraction (generalisation via naming and
      specialisation via replacement) to derive parameterised expressions and functions.
    concepts:
    - concept:concept_names_and_values
    reference_id: chunk:gjm_lambda_book--2_lambda_calculus
  - text: 'Read and construct λ-expressions: names, functions ($\\lambda$-abstraction)
      and applications; understand the BNF-style syntax presented.'
    concepts:
    - concept:concept_calculus
    reference_id: chunk:gjm_lambda_book--2_lambda_calculus
  - text: 'Perform normal-order β-reduction: reduce the function expression first,
      substitute free occurrences of the bound variable with the (unevaluated) argument,
      and continue reducing; contrast with applicative-order (call-by-value).'
    concepts:
    - concept:concept_calculus
    - concept:concept_evaluation_order
    reference_id: chunk:gjm_lambda_book--2_lambda_calculus
  - text: Identify free vs bound variables and scopes in λ-expressions, and apply
      α-conversion (renaming bound variables) to avoid name capture during substitution.
    concepts:
    - concept:concept_calculus
    reference_id: chunk:gjm_lambda_book--2_lambda_calculus
  - text: Use η-reduction to simplify expressions of the form $\\lambda x.(E\\;x)$
      to $E$ when appropriate.
    concepts:
    - concept:concept_calculus
    reference_id: chunk:gjm_lambda_book--2_lambda_calculus
  - text: Construct and reason about higher-order functions and combinators (identity,
      self-application, apply) and encode data structures (pairs, selectors, and extension
      to triplets) using pure functions.
    concepts:
    - concept:concept_functions_as_values_higher_order_functions
    reference_id: chunk:gjm_lambda_book--2_lambda_calculus
  - text: Recognise that some λ-expressions do not terminate (infinite reduction sequences)
      and relate this to computability limitations.
    concepts:
    - concept:concept_computability_theory
    reference_id: chunk:gjm_lambda_book--2_lambda_calculus
  - text: Apply syntactic sugar (named definitions, infix notation, conditional forms)
      as compile-time rewrites into pure λ-calculus to preserve time-order independence
      of substitutions.
    concepts: []
    reference_id: chunk:gjm_lambda_book--2_lambda_calculus
  chunk:gjm_lambda_book--3_conditions_booleans_and_integers:
  - text: Encode truth values and conditional selection in the λ-calculus so that
      a condition selects one of two expressions (if-then-else via cond).
    concepts:
    - concept:concept_calculus
    reference_id: chunk:gjm_lambda_book--3_conditions_booleans_and_integers
  - text: Derive standard boolean operators (not, and, or) from the conditional/pair-selector
      representation and verify them against truth tables.
    concepts:
    - concept:concept_calculus
    - concept:concept_functions_as_values_higher_order_functions
    reference_id: chunk:gjm_lambda_book--3_conditions_booleans_and_integers
  - text: Represent natural numbers as nested successor pairs (zero and succ), implement
      iszero and pred, and handle the zero predecessor case via conditional logic.
    concepts:
    - concept:concept_calculus
    - concept:concept_computability_theory
    reference_id: chunk:gjm_lambda_book--3_conditions_booleans_and_integers
  - text: 'Apply compact surface syntax: omit parentheses in applications, shorten
      λ-definitions into def name args = body, and use if-then-else as syntactic sugar
      for cond.'
    concepts:
    - concept:concept_names_and_values
    - concept:concept_evaluation_order
    reference_id: chunk:gjm_lambda_book--3_conditions_booleans_and_integers
  - text: 'Practice formal reasoning: prove boolean identities and define derived
      operators (implies, equiv) using the same selector-based encodings.'
    concepts:
    - concept:concept_calculus
    - concept:concept_recursion
    reference_id: chunk:gjm_lambda_book--3_conditions_booleans_and_integers
  chunk:gjm_lambda_book--4_recursion_and_arithmetic:
  - text: Explain why naive self-reference in a definition leads to non-terminating
      replacement and how abstraction at the recursion point delays substitution to
      produce finite evaluation in concrete uses.
    concepts:
    - concept:recursion
    reference_id: chunk:gjm_lambda_book--4_recursion_and_arithmetic
  - text: Construct a recursive function by passing a function to itself and derive
      the fixed-point/paradoxical combinator (Y) $ (\lambda s.\,f\,(s\,s))(\lambda
      s.\,f\,(s\,s)) $ to generate recursion from a non-recursive body.
    concepts:
    - concept:calculus
    - concept:functions_as_values_higher_order_functions
    reference_id: chunk:gjm_lambda_book--4_recursion_and_arithmetic
  - text: Use the rec notation (rec <name> = <expr>) as syntactic sugar that binds
      the name via the fixed-point combinator so recursive references remain for evaluation.
    concepts:
    - concept:calculus
    reference_id: chunk:gjm_lambda_book--4_recursion_and_arithmetic
  - text: Understand applicative-order β-reduction (evaluate arguments before application)
      vs normal order, and why conditional evaluation must be treated to avoid non-termination
      in applicative examples.
    concepts:
    - concept:evaluation_order
    reference_id: chunk:gjm_lambda_book--4_recursion_and_arithmetic
  - text: Define standard arithmetic operations (add, mult, power, sub, equal, greater,
      greater_or_equal, div) recursively in the λ-calculus and trace example reductions
      (e.g. mult three two => six).
    concepts:
    - concept:recursion
    reference_id: chunk:gjm_lambda_book--4_recursion_and_arithmetic
  chunk:gjm_lambda_book--5_types:
  - text: Explain why untyped function application can produce meaningless but well-formed
      functions and motivate the need for types to constrain operations to meaningful
      combinations.
    concepts:
    - concept:calculus
    - concept:functional_programming
    reference_id: chunk:gjm_lambda_book--5_types
  - text: Represent typed values as explicit type/value pairs, and provide constructors
      and selectors (make_obj, type, value) for manipulating them.
    concepts:
    - concept:names_and_values
    - concept:functions_as_values_higher_order_functions
    reference_id: chunk:gjm_lambda_book--5_types
  - text: Introduce an error type and canonical ERROR objects; specify that operations
      return typed error objects on type mismatches and show how iserror detects them.
    concepts:
    - concept:types_and_values
    reference_id: chunk:gjm_lambda_book--5_types
  - text: Define a typed boolean type (bool_type), typed booleans TRUE/FALSE, typed
      operations NOT and AND, and a typed conditional COND/IF that enforces boolean-typed
      conditions.
    concepts:
    - concept:functional_programming
    reference_id: chunk:gjm_lambda_book--5_types
  - text: Define a typed numeric type (numb_type) and numeric constructors (MAKE_NUMB,
      0, SUCC), typed numeric predicates (ISNUMB, ISZERO) and arithmetic (+, *, /)
      that return NUMB_ERROR on invalid inputs or zero division.
    concepts:
    - concept:recursion
    - concept:functional_programming
    reference_id: chunk:gjm_lambda_book--5_types
  - text: Represent characters as a char_type whose values are mapped to untyped numeric
      ASCII codes; provide CHAR and ORD conversions and character comparisons implemented
      via numeric comparison.
    concepts:
    - concept:data_structures_lists_vs_arrays
    reference_id: chunk:gjm_lambda_book--5_types
  - text: Show the cost of repetitive dynamic type checks (many nested IF/ISNUMB checks)
      and contrast dynamic (run-time) checking with static (compile-time) typing to
      avoid redundant checks.
    concepts:
    - concept:evaluation_order
    - concept:computability_theory
    reference_id: chunk:gjm_lambda_book--5_types
  - text: 'Introduce syntactic conveniences: bracketed infix operators for binary
      functions, and case definitions / structure matching (e.g. def NOT TRUE = FALSE,
      rec POWER X 0 = 1) for clearer pattern-based definitions.'
    concepts:
    - concept:calculus
    reference_id: chunk:gjm_lambda_book--5_types
