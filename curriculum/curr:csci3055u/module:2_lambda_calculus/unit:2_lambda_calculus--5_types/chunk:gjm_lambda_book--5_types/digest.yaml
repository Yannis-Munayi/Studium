element_id: chunk:gjm_lambda_book--5_types
level: document
variant: default
content:
  summary:
    name: Types and Typed Representations in a Functional Language
    oneliner: Introduction of types, typed object representations, typed booleans/numbers/characters,
      typed operations, IF notation, infix operators, and case/structure matching
      in a simple functional language
    short: 'Describes adding types to a minimal functional notation: representing
      typed values as type/value pairs, error handling for type errors, typed booleans,
      numbers and characters, typed conditionals, and convenient notations (infix,
      IF...THEN...ELSE, case matching).'
    long: 'This chapter develops a practical approach to adding types to a simple
      functional language built from functions (λ-abstractions and applications).
      It motivates types by showing the problems of untyped function application,
      then gives a representation of typed objects as type/value pairs, with numeric
      codes used for types and accessors to extract type and value. It introduces
      an error type and a canonical ERROR object and prescribes that operations must
      return typed error objects on type mismatches. Using the pair representation
      the chapter constructs typed booleans, numbers and characters, together with
      typed operations: NOT, AND, typed conditional COND/IF (which returns a typed
      boolean or BOOL_ERROR), numeric constructors (MAKE_NUMB, SUCC, PRED), arithmetic
      (+, *, / with zero-divisor handling), and character operations (CHAR, ORD, CHAR_LESS,
      CHAR_EQUAL) by mapping characters to numeric values (ASCII). It explains the
      performance problems of repetitive dynamic type checks and contrasts dynamic
      (run-time) checking with static (compile-time) typing, noting that static checking
      can eliminate redundant checks. Finally, the chapter extends notation to allow
      bracketed infix operators and concise case definitions / structure matching
      for booleans and numbers (e.g., def NOT TRUE = FALSE, rec POWER X 0 = 1), and
      summarizes the role of types, typed representations, error handling and the
      new notations. Throughout the approach untyped primitives are used only to define
      basic typed functions; subsequent programming should use the typed interfaces
      to avoid violating checks.'
  highlights:
  - text: Explain why untyped function application can produce meaningless but well-formed
      functions and motivate the need for types to constrain operations to meaningful
      combinations.
    concepts:
    - concept:calculus
    - concept:functional_programming
    reference_id: chunk:gjm_lambda_book--5_types
  - text: Represent typed values as explicit type/value pairs, and provide constructors
      and selectors (make_obj, type, value) for manipulating them.
    concepts:
    - concept:names_and_values
    - concept:functions_as_values_higher_order_functions
    reference_id: chunk:gjm_lambda_book--5_types
  - text: Introduce an error type and canonical ERROR objects; specify that operations
      return typed error objects on type mismatches and show how iserror detects them.
    concepts:
    - concept:types_and_values
    reference_id: chunk:gjm_lambda_book--5_types
  - text: Define a typed boolean type (bool_type), typed booleans TRUE/FALSE, typed
      operations NOT and AND, and a typed conditional COND/IF that enforces boolean-typed
      conditions.
    concepts:
    - concept:functional_programming
    reference_id: chunk:gjm_lambda_book--5_types
  - text: Define a typed numeric type (numb_type) and numeric constructors (MAKE_NUMB,
      0, SUCC), typed numeric predicates (ISNUMB, ISZERO) and arithmetic (+, *, /)
      that return NUMB_ERROR on invalid inputs or zero division.
    concepts:
    - concept:recursion
    - concept:functional_programming
    reference_id: chunk:gjm_lambda_book--5_types
  - text: Represent characters as a char_type whose values are mapped to untyped numeric
      ASCII codes; provide CHAR and ORD conversions and character comparisons implemented
      via numeric comparison.
    concepts:
    - concept:data_structures_lists_vs_arrays
    reference_id: chunk:gjm_lambda_book--5_types
  - text: Show the cost of repetitive dynamic type checks (many nested IF/ISNUMB checks)
      and contrast dynamic (run-time) checking with static (compile-time) typing to
      avoid redundant checks.
    concepts:
    - concept:evaluation_order
    - concept:computability_theory
    reference_id: chunk:gjm_lambda_book--5_types
  - text: 'Introduce syntactic conveniences: bracketed infix operators for binary
      functions, and case definitions / structure matching (e.g. def NOT TRUE = FALSE,
      rec POWER X 0 = 1) for clearer pattern-based definitions.'
    concepts:
    - concept:calculus
    reference_id: chunk:gjm_lambda_book--5_types
