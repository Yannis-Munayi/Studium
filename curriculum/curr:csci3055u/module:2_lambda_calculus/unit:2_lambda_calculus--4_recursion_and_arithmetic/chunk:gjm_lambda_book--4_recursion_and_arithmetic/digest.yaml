element_id: chunk:gjm_lambda_book--4_recursion_and_arithmetic
level: document
variant: default
content:
  summary:
    name: Recursion and arithmetic in the λ-calculus
    oneliner: Recursion and arithmetic — introducing recursion by abstraction and
      self-application (the Y combinator), applicative vs normal order, and recursive
      definitions of standard arithmetic operations.
    short: Explains how to obtain finite recursive behaviour in the λ-calculus by
      abstracting recursion points and using self-application (the paradoxical combinator/Y),
      shows applicative-order considerations, introduces rec notation, and builds
      arithmetic (add, mult, power, sub, equal, inequalities, div).
    long: 'This document develops recursion as the mechanism for repetition in functional
      programming and the λ-calculus. It shows why naively allowing a name to appear
      in its own definition leads to non-terminating infinite replacement, and how
      to delay self-reference by abstracting the recursion point (introducing an extra
      parameter that stands for the recursive call). It explains the technique of
      passing a function to itself and shows progressively refined encodings (add1,
      add2) that ensure a copy of the function is passed down each recursive step.


      A general fixed-point / recursion constructor is derived using self-application;
      the document presents the recursive combinator (the paradoxical combinator,
      called Y) as:

      $ \text{recursive}\ f = (\lambda s.\,f\,(s\,s))\;(\lambda s.\,f\,(s\,s)) $,

      and shows how applying this to a non-recursive body yields a recursive function.
      The text introduces a convenient definition form

      rec <name> = <expression>

      that expands to using the recursive combinator (so recursive references are
      left in place for evaluation).


      Applicative-order β-reduction is discussed: arguments are typically reduced
      before function application (notation -> and -> ... -> are introduced), but
      conditional expressions are treated carefully to avoid spurious non-termination
      in examples. The relationship between normal and applicative order is noted:
      when evaluation terminates both give the same result, but some expressions terminate
      only under normal order.


      Using recursion, the document defines standard arithmetic on Church-like numerals
      (using named constructors succ, pred, iszero, zero, one, etc.): addition (rec
      add), multiplication (rec mult), exponentiation (rec power), natural subtraction
      (rec sub), equality (via abs_diff or recursive equal), inequalities (greater,
      greater_or_equal), and integer division with a guarded-case for divisor zero
      (rec div1 and def div). Several worked reductions demonstrate each definition.
      A short exercise set asks to build sums, products, and parameterised summations
      using the recursive pattern.


      Overall, the focus is on (1) obtaining recursion without infinite textual substitution
      by using abstraction and self-application (fixed-point construction), (2) practical
      applicative-order evaluation conventions for examples, (3) notation (rec) for
      defining recursive functions, and (4) using these techniques to implement and
      reason about arithmetic in the λ-calculus.'
  highlights:
  - text: Explain why naive self-reference in a definition leads to non-terminating
      replacement and how abstraction at the recursion point delays substitution to
      produce finite evaluation in concrete uses.
    concepts:
    - concept:recursion
    reference_id: chunk:gjm_lambda_book--4_recursion_and_arithmetic
  - text: Construct a recursive function by passing a function to itself and derive
      the fixed-point/paradoxical combinator (Y) $ (\lambda s.\,f\,(s\,s))(\lambda
      s.\,f\,(s\,s)) $ to generate recursion from a non-recursive body.
    concepts:
    - concept:calculus
    - concept:functions_as_values_higher_order_functions
    reference_id: chunk:gjm_lambda_book--4_recursion_and_arithmetic
  - text: Use the rec notation (rec <name> = <expr>) as syntactic sugar that binds
      the name via the fixed-point combinator so recursive references remain for evaluation.
    concepts:
    - concept:calculus
    reference_id: chunk:gjm_lambda_book--4_recursion_and_arithmetic
  - text: Understand applicative-order β-reduction (evaluate arguments before application)
      vs normal order, and why conditional evaluation must be treated to avoid non-termination
      in applicative examples.
    concepts:
    - concept:evaluation_order
    reference_id: chunk:gjm_lambda_book--4_recursion_and_arithmetic
  - text: Define standard arithmetic operations (add, mult, power, sub, equal, greater,
      greater_or_equal, div) recursively in the λ-calculus and trace example reductions
      (e.g. mult three two => six).
    concepts:
    - concept:recursion
    reference_id: chunk:gjm_lambda_book--4_recursion_and_arithmetic
