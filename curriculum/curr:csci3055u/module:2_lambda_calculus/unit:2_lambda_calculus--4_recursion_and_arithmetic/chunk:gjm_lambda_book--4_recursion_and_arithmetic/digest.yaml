    subtopics:
    - key: subtopic:fixed_point_combinators_and_theoretical_notes
      summary:
        name: Fixed-point combinators and theoretical notes
        oneliner: Discussion of the Y combinator, self-application, and relationship
          to computability
        short: Explains the self-replicating application pattern λs.(s s) and how
          wrapping it via λf.λs.(f (s s)) delays replication; identifies the recursive
          builder as the paradoxical combinator (Y). Mentions connection to fixed
          points in λ-calculus and computability implications.
        long: 'The chapter motivates the fixed-point construction by requiring a copy
          mechanism that, when applied, yields f applied to the copy mechanism again:

          <''f'' and copy> => ... => f <''f'' and copy>

          Using self-application λs.(s s) replicates but diverges; delaying it by
          abstraction yields λf.(λs.(f (s s))) (λs.(f (s s))) which behaves as a fixed-point
          constructor.

          This construction (Y combinator) is central in the λ-calculus for expressing
          recursion without named self-reference. Its existence connects to computability
          theory (fixed-point theorems, expressiveness of λ-calculus).'
