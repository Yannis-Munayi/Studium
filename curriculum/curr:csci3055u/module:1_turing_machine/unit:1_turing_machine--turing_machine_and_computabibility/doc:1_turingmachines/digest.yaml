    subtopics: []
  - key: topic:computation_mechanics
    summary:
      name: Computation Mechanics
      oneliner: Understanding how computation functions.
      short: Operations carried out in computation.
      long: This topic addresses the various operations involved in computation, explaining
        how Turing machines execute instructions.
    entities:
    - key: definition:input
      kind: definition
      summary:
        name: Input
        oneliner: Symbols provided to a computation machine.
        short: Data fed into a machine for processing.
        long: The initial data required for a computation to take place, essential
          for Turing machines to function.
      fact_kind: null
      related_to:
      - type: is_a
        target_key: concept:input
    - key: definition:output
