    subtopics:
    - key: subtopic:sequence_predicates_and_filters
      summary:
        name: Sequence predicates and filters
        oneliner: Predicates like every?, some and filters like filter, take-while,
          drop-while, split-with.
        short: Discusses testing predicates across sequences and filtering/partitioning
          operations.
        long: 'Covers:

          - (filter pred coll) to select elements.

          - (take n coll), (take-while pred coll) and (drop-while pred coll) for prefix
          operations.

          - (split-at idx coll) and (split-with pred coll) to partition into two sequences.

          - Predicates: (every? pred coll) returns true iff pred true for all elements;
          (some pred coll) returns first truthy result (not strictly boolean); not-every?
          and not-any? convenience inverses.

          Be cautious applying these to infinite sequences (may not terminate).'
