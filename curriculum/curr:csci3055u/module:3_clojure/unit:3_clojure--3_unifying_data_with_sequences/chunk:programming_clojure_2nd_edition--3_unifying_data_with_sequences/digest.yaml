    - key: example:using_for_comprehensions_chessboard_and_html_wrapping_examples
      kind: example
      summary:
        name: 'Using for comprehensions: chessboard and HTML wrapping examples'
        oneliner: for used to generate chessboard coordinates and to format sequences
          into HTML tags.
        short: 'Examples: (for [file "ABCDEFGH" rank (range 1 9)] (format "%c%d" file
          rank)) and (for [word ["the" "quick" "brown" "fox"]] (format "<p>%s</p>"
          word)) showing nested iteration and simple mapping.'
        long: 'for comprehensions generalize map and filter:

          - Nested bindings produce Cartesian products in a controlled order (rightmost
          binding iterates fastest unless order reversed).

          - :when acts as a filter, :while limits continuation.

          - Example uses: generate board squares in algebraic notation (file × rank)
          and produce HTML-wrapped strings from words.

          These examples show clear, declarative sequence transformations that remain
          lazy until realized.'
      fact_kind: null
      related_to:
