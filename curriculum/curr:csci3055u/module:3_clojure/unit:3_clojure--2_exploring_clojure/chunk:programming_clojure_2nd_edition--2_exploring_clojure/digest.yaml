    - key: subtopic:strings_and_characters
      summary:
        name: Strings and Characters
        oneliner: Clojure strings are Java strings; characters are written as \\c.
          Strings are sequences of characters; apply str constructs strings from char
          sequences.
        short: Use Java interop for methods (.toUpperCase \"hello\"); use apply str
          to convert char sequences back to strings.
        long: 'Strings are Java java.lang.String objects, delimited by double quotes
          and can be multiline. Characters are literals like \\a or named escapes
          like \\newline. Strings are sequences, so sequence functions produce sequences
          of characters. Use (apply str coll) to build a string from a character sequence.
          Call Java methods via interop: (.toUpperCase \"hello\").'
      entities:
      - key: example:interleaving_strings_example
        kind: example
        summary:
          name: Interleaving strings example
          oneliner: (apply str (interleave \"A\" \"B\")) builds an interleaved string;
            use take-nth to extract original.
          short: Shows interleave, apply str, and take-nth to conceal/recover messages.
          long: (interleave \"Attack at midnight\" \"The purple elephant chortled\")
            yields a char sequence; (apply str ...) converts the lazy sequence to
            a string. Then (apply str (take-nth 2 ...)) recovers the original hidden
            message.
        fact_kind: null
        related_to:
        - type: part_of
          target_key: concept:strings_and_characters
      related_to:
      - type: is_a
        target_key: concept:strings_and_characters
      - type: related_to
        target_key: concept:calling_java
      subtopics: []
    - key: subtopic:maps_keywords_and_records
      summary:
        name: Maps, Keywords, and Records
        oneliner: Maps are key/value collections; keywords (:%) evaluate to themselves
          and act as functions for lookup; defrecord defines typed map-like records
          with constructors and literal syntax.
        short: Use {:k v} for maps, :key for keywords which can be called as functions
          on maps, and defrecord to define records that behave like maps.
        long: 'Maps use curly-brace literals and can be used as functions: (m k) returns
          the value or nil. Keywords like :Clojure evaluate to themselves and can
          be invoked as lookup functions: (:k m). defrecord creates a concrete record
          type whose instances behave like associative maps but also have a distinct
          class name and constructors (->Type, Type.). Record literals are printed
          as #namespace.Type{:k v} and can be used for structured data.'
      entities:
      - key: example:keyword_lookup_example
        kind: example
        summary:
          name: Keyword lookup example
          oneliner: (:Clojure {:Clojure \"Hickey\"}) => \"Hickey\"; maps used as functions
            too.
          short: Shows both keyword-as-function and map-as-function lookup styles.
          long: (def inventors {:Lisp \"McCarthy\" :Clojure \"Hickey\"}) then (inventors
            :Clojure) and (:Clojure inventors) both return \"Hickey\".
        fact_kind: null
        related_to:
        - type: part_of
          target_key: concept:maps_keywords_and_records
      related_to:
      - type: is_a
        target_key: concept:maps_keywords_and_records
      subtopics: []
    - key: subtopic:calling_java_interop
      summary:
        name: Calling Java (Interop)
        oneliner: Construct Java objects, call methods, access fields and statics,
          and import classes for short names.
        short: (new java.util.Random), (.instance method args), (. ClassName FIELD)
          for statics, import to shorten names.
        long: 'Clojure interop: create instances with (new ClassName ...) or ClassName.
          constructor-call syntax. Invoke methods and access fields with (. instance
          method args) or (. ClassName STATICFIELD) for statics. import maps Java
          classes into the namespace to avoid fully qualified names. Use (javadoc
          Class) in REPL to view Java API.'
      entities:
      - key: example:random_and_math_examples
        kind: example
        summary:
          name: Random and Math examples
          oneliner: (def rnd (new java.util.Random)) (. rnd nextInt 10) => random
            int < 10; (. Math PI) => Math.PI.
          short: Demonstrates creating java.util.Random and calling instance and static
            members.
          long: (def rnd (new java.util.Random)) binds a Random to a var; (. rnd nextInt
            10) calls nextInt(10). Static fields/methods accessible as (. Math PI)
            or (Math/sin x) when appropriate. Use import to shorten class references.
        fact_kind: null
        related_to:
        - type: part_of
          target_key: concept:calling_java
      related_to:
      - type: is_a
        target_key: concept:calling_java
      - type: related_to
        target_key: concept:symbols
      subtopics: []
    - key: subtopic:flow_control_if_do_loop_recur
      summary:
        name: 'Flow Control: if, do, loop/recur'
        oneliner: 'Clojure provides a small set of control constructs: if for branching,
          do for sequencing side effects, and loop/recur for explicit recursion.'
        short: if has optional else, do groups side effects returning last value,
          loop establishes recursion point and recur rebinds for tail recursion.
        long: if evaluates a test expression and chooses the then or else branch (else
          optional, returning nil if absent). do evaluates multiple forms for their
          side effects and returns the last form's value. loop establishes bindings
          and a recursion point; recur performs a tail-call back to the nearest loop
          or function body (optimized), re-binding the loop's bindings. Clojure does
          not perform general TCO but will optimize recur. Macros like when are built
          on if.
      entities:
      - key: example:countdown_with_loop_recur
        kind: example
        summary:
          name: Countdown with loop/recur
          oneliner: (loop [result [] x 5] (if (zero? x) result (recur (conj result
            x) (dec x)))) => [5 4 3 2 1].
          short: Illustrates using loop/recur to accumulate a result without mutable
            vars.
          long: loop binds result and x; recur supplies new bindings to loop and jumps
            to top. The pattern produces a countdown vector by conjoining x then decrementing
            until zero, when the accumulated result is returned.
        fact_kind: null
        related_to:
        - type: part_of
          target_key: concept:flow_control
        - type: related_to
          target_key: concept:bindings
      related_to:
      - type: is_a
        target_key: concept:flow_control
      subtopics: []
    - key: subtopic:where_s_my_for_loop_functional_replacement_of_imperative_loops
      summary:
        name: Where's My for Loop? — Functional Replacement of Imperative Loops
        oneliner: Example showing how sequence functions, comprehensions, and higher-order
          functions replace for loops and mutable vars.
        short: Demonstrates porting an imperative indexOfAny to functional index-of-any
          using map-indexed, for comprehensions, filter, and first.
        long: 'The chapter ports Apache Commons StringUtils.indexOfAny (imperative
          loops, mutable locals, multiple returns) to a concise functional version:
          indexed = map-indexed vector; index-filter uses for comprehension to yield
          indices when a predicate matches; index-of-any returns (first (index-filter
          pred coll)). The functional version is shorter, handles edge cases naturally,
          is more general (works on any sequence and predicate), and eliminates explicit
          mutation. Metrics compare LOC, branches, exits, and variables.'
      entities:
      - key: example:functional_index_of_any_example
        kind: example
        summary:
          name: Functional index-of-any example
          oneliner: (defn indexed [coll] (map-indexed vector coll)); (defn index-filter
            [pred coll] (when pred (for [[idx elt] (indexed coll) :when (pred elt)]
            idx))); (defn index-of-any [pred coll] (first (index-filter pred coll))).
          short: Shows compositions of map-indexed, for, when, and first to replace
            nested loops.
          long: 'Defines indexed to produce ([0 elt0] [1 elt1] ...), index-filter
            to yield matching indices via a for comprehension with :when guard, and
            index-of-any to pick the first match. Examples: (index-of-any #{\\z \\a}
            \"zzabyycdxx\") => 0. Functional approach removes special-case checks
            and mutable variables and generalizes behavior (any sequence, any predicate).'
        fact_kind: null
        related_to:
        - type: depends_on
          target_key: concept:functions
        - type: depends_on
          target_key: concept:forms
      related_to:
      - type: related_to
        target_key: concept:forms
      - type: related_to
        target_key: concept:functions
      - type: related_to
        target_key: concept:anonymous_functions
      - type: related_to
        target_key: concept:bindings
      subtopics: []
    - key: subtopic:metadata
      summary:
        name: Metadata
        oneliner: Metadata is auxiliary data attached to vars and objects via ^reader
          macro or meta functions; common keys include :doc, :arglists, :file, :line,
          :tag, :ns, :name.
        short: 'Use ^{:tag Type} or ^Type short form to attach :tag; meta and (meta
          #''var) inspect metadata.'
        long: 'Metadata is data about data orthogonal to logical value. Vars carry
          metadata including documentation, arglists, source file/line, :tag for type
          hints, and :macro flag. Attach metadata with the ^reader macro (e.g., (defn
          ^String shout [^String s] (.toUpperCase s))). Inspect with (meta #''var).
          Metadata is used by doc, compiler optimizations (type hints), and tooling.'
      entities:
      - key: fact:common_metadata_keys
        kind: fact
        summary:
          name: Common metadata keys
          oneliner: :arglists, :doc, :file, :line, :macro, :name, :ns, :tag are common
            keys on var metadata.
          short: Table of frequent metadata keys and their uses (docstring, arglists,
            source info, type tag).
          long: 'Example meta map for str: {:ns #<Namespace clojure.core>, :name str,
            :file \"core.clj\", :line 313, :arglists ([] [x] [x & ys]), :tag java.lang.String,
            :doc \"With no args, ...\"}. The :tag key is commonly used for type hints
            and may be written ^Type as shorthand for ^{:tag Type}.'
        fact_kind: fact
        related_to:
        - type: same_as
          target_key: concept:metadata
      related_to:
      - type: is_a
        target_key: concept:metadata
      - type: related_to
        target_key: concept:vars
      subtopics: []
