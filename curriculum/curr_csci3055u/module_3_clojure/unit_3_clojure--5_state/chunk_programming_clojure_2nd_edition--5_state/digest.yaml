    - key: subtopic:agents_asynchronous_updates_and_side_effects
      summary:
        name: 'Agents: Asynchronous Updates and Side Effects'
        oneliner: Agents run update functions asynchronously on thread pools; use
          send/send-off, await/await-for, and handle agent errors.
        short: Agents queue functions to update state asynchronously. Use send for
          non-blocking tasks, send-off for potentially blocking ones; inspect errors
          with agent-errors and reset with clear-agent-errors.
        long: 'Agents represent state updated by actions executed later on a thread
          pool. Key ideas:

          - send enqueues a nonblocking action on a fixed pool.

          - send-off enqueues potentially blocking actions on an expanding pool.

          - deref/@ reads current value; send returns immediately (does not return
          new value).

          - await/await-for block current thread until actions sent from the current
          thread are complete (await-for supports timeout).

          - Agents can accept validators and can become errored if an action throws;
          use agent-errors to inspect and clear-agent-errors to recover.

          Agents can be used in conjunction with transactions: sends made within a
          dosync are guaranteed to be sent exactly once if the transaction commits
          — useful for side effects that should occur only when a transaction succeeds
          (e.g., file backups), but those side effects are not part of the transaction''s
          atomic/durable guarantees.'
      entities:
      - key: example:backup_agent_sent_within_transaction
        kind: example
        summary:
          name: Backup agent sent within transaction
          oneliner: Use (send-off backup-agent (fn [filename] (spit filename snapshot)
            filename)) inside dosync to enqueue durable side-effect on transaction
            success.
          short: Inside a transaction, compute snapshot (commute) then send-off an
            agent to write it to disk; agent action runs after transaction commits.
          long: 'Demonstrates pattern: inside dosync use commute to get a snapshot
            and (send-off backup-agent ...) to write to disk. The agent action is
            enqueued exactly once on successful commit. But the write itself is not
            protected by STM (no durability guarantee); power loss after commit and
            before agent write can lose the backup.'
        fact_kind: null
        related_to:
        - type: depends_on
          target_key: concept:agents
        - type: related_to
          target_key: concept:commute_vs_alter_commutativity_optimization
        - type: related_to
          target_key: concept:transactions_dosync_and_transactional_operations
      related_to:
      - type: same_as
        target_key: concept:agents
      - type: related_to
        target_key: concept:await_await_for_and_agent_error_handling
      subtopics: []
    - key: subtopic:vars_and_dynamic_binding
      summary:
        name: Vars and Dynamic Binding
        oneliner: Vars provide root bindings and optionally per-thread dynamic rebinding
          via binding; set! for thread-local mutation in interop cases.
        short: def/defn create vars with root bindings; ^:dynamic vars can be rebound
          per-thread with binding. set! is available for thread-local mutation in
          specific interop use (e.g., SAX handlers).
        long: Vars (created by def/defn) have a root binding visible to all threads.
          Vars marked ^:dynamic can be thread-locally rebound using binding, which
          creates dynamic scope visible to callees on that thread only. This enables
          "action at a distance" (e.g., temporarily swapping implementations such
          as memoized functions), but it breaks referential transparency and should
          be used sparingly (mainly for interop with single-threaded callback APIs).
          set! mutates thread-local vars and is used rarely (e.g., SAX ContentHandler
          internals).
      entities:
      - key: example:dynamic_rebinding_of_a_slow_function_for_memoization
        kind: example
        summary:
          name: Dynamic rebinding of a slow function for memoization
          oneliner: Temporarily bind slow-double to (memoize slow-double) so callers
            see faster behavior without changing callers' code.
          short: (binding [slow-double (memoize slow-double)] (calls-slow-double))
          long: Shows using binding to alter the behavior of existing code by rebinding
            a dynamic var to a memoized version of a function. Useful for testing
            or performance tweaks but demonstrates action-at-a-distance risks.
        fact_kind: null
        related_to:
        - type: depends_on
          target_key: concept:vars
        - type: related_to
          target_key: concept:memoization
      related_to:
      - type: same_as
        target_key: concept:vars
      - type: related_to
        target_key: concept:bindings
      - type: related_to
        target_key: concept:memoization
      subtopics: []
    - key: subtopic:unified_update_model
      summary:
        name: Unified Update Model
        oneliner: 'Refs, atoms, and agents share a unified update model: applying
          functions to previous state; ancillary ops reflect semantic differences.'
        short: 'Common pattern: update by applying a function to prior state. Refs:
          alter/commute/ref-set; Atoms: swap!/reset!; Agents: send/send-off.'
        long: 'Clojure presents a unified conceptual model: update a reference by
          supplying a function that computes the new value from the old. Differences
          are mainly operational: refs support coordinated transactions and commute
          optimizations; atoms update synchronously on the caller''s thread; agents
          apply updates asynchronously on thread pools (send vs send-off). This model
          helps reason about state changes consistently across reference types.'
      entities:
      - key: table:update_primitives_summary
        kind: table
        summary:
          name: Update primitives summary
          oneliner: Tabular summary of update functions per reference type.
          short: 'Ref: alter/commute/ref-set; Atom: swap!/reset!; Agent: send/send-off.'
          long: 'Summary:

            - Ref: alter (function application), commute (commutative function, reorderable),
            ref-set (simple setter inside dosync).

            - Atom: swap! (function application, may retry), reset! (simple setter).

            - Agent: send (nonblocking update), send-off (for blocking operations).

            This table emphasizes the semantic differences that determine which model
            to choose.'
        fact_kind: null
        related_to:
        - type: related_to
          target_key: concept:swap_and_reset_atom_operations
        - type: related_to
          target_key: concept:commute_vs_alter_commutativity_optimization
      related_to:
      - type: related_to
        target_key: concept:refs_and_software_transactional_memory
      - type: related_to
        target_key: concept:atoms
      - type: related_to
        target_key: concept:agents
      subtopics: []
    - key: subtopic:example_snake_game_putting_it_together
      summary:
        name: 'Example: Snake Game (Putting it together)'
        oneliner: 'Small application demonstrating layering: pure functional model
          + small mutable layer (refs or atom) + Swing UI.'
        short: Functional pure model for game logic; refs (or atom alternative) for
          mutable state; Swing GUI and timer/keyboard input tie it together.
        long: 'The Snake example divides the program into:

          1. Functional model: pure functions for points, move, turn, win?/lose?/eats?
          etc.

          2. Mutable model: minimal refs (snake and apple) updated inside dosync with
          alter/ref-set/update-positions; an atom-based variant is also presented
          where the entire game state is a single atom and updated with swap!.

          3. GUI: Swing JPanel via proxy, Timer triggers actionPerformed to call update-positions
          and repaint; key events update direction.

          The example illustrates choosing refs when coordinated updates (snake+apple)
          are required, or an atom when bundling state into one value removes that
          need.'
      entities:
      - key: example:mutable_model_with_refs_reset_game_update_positions_update_direction
        kind: example
        summary:
          name: 'Mutable model with refs: reset-game / update-positions / update-direction'
          oneliner: reset-game uses dosync/ref-set; update-positions checks eats?
            and uses alter move :grow; update-direction uses dosync alter turn.
          short: Three small transactional functions implement the mutable core of
            the game.
          long: 'reset-game: (dosync (ref-set apple (create-apple)) (ref-set snake
            (create-snake)))

            update-direction: (when newdir (dosync (alter snake turn newdir)))

            update-positions: (dosync (if (eats? @snake @apple) (do (ref-set apple
            (create-apple)) (alter snake move :grow)) (alter snake move)))

            These keep mutable logic localized and coordinated via STM.'
        fact_kind: null
        related_to:
        - type: depends_on
          target_key: concept:transactions_dosync_and_transactional_operations
        - type: depends_on
          target_key: concept:refs_and_software_transactional_memory
      - key: example:atom_based_alternative
        kind: example
        summary:
          name: Atom-based alternative
          oneliner: Combine snake and apple into one game map stored in an atom and
            update with swap!.
          short: Single-atom model removes need for coordination across multiple refs.
          long: An alternative implementation uses a single atom game with keys :snake
            and :apple. update-positions becomes a pure function returning a new game
            map; GUI uses (swap! game update-positions). This demonstrates that packaging
            related state into one atomic location can simplify concurrency needs.
        fact_kind: null
        related_to:
        - type: depends_on
          target_key: concept:atoms
        - type: related_to
          target_key: concept:swap_and_reset_atom_operations
      related_to:
      - type: depends_on
        target_key: concept:refs_and_software_transactional_memory
      - type: related_to
        target_key: concept:atoms
      - type: related_to
        target_key: concept:agents
      subtopics: []
