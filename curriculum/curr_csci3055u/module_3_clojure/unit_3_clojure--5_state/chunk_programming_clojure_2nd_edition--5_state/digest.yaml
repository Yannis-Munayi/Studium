  topics:
  - key: topic:state_and_identity_in_clojure
    summary:
      name: State and Identity in Clojure
      oneliner: Overview of Clojure's models for mutable identity and how they fit
        with immutable values.
      short: Clojure separates identity (mutable reference) from value (immutable).
        Provides refs, atoms, agents, and vars to manage different state/update semantics.
      long: 'This topic summarizes the chapter''s central theme: most data in Clojure
        are immutable values, and mutable "identity" is represented explicitly with
        a small set of reference types. The chapter motivates the separation (values
        vs identities), discusses concurrency/parallelism issues with mutable state,
        and introduces the four reference models (refs, atoms, agents, vars) and when
        to use each. It also presents a worked example (a Snake game) that mixes a
        functional model with minimal mutable state.'
    entities:
    - key: definition:value_vs_identity
      kind: definition
      summary:
        name: Value vs Identity
        oneliner: 'Distinction: values are immutable persistent data; identities are
          references to values that change over time.'
        short: Values = immutable; identities = mutable references to values (explicit
          in Clojure).
        long: 'A value is an immutable, persistent data structure. An identity is
          the notion of "the same conceptual entity over time" whose current value
          can change. Clojure separates these: nearly everything is a value; identities
          are explicit via refs, atoms, agents, or vars. Updates to identities do
          not destroy previous values — old values remain accessible.'
      fact_kind: null
      related_to:
      - type: related_to
        target_key: concept:vars
    related_to:
    - type: depends_on
      target_key: concept:concurrency_and_parallelism_and_locking_pitfalls
    subtopics:
    - key: subtopic:concurrency_and_parallelism_motivation
      summary:
        name: Concurrency and Parallelism Motivation
        oneliner: Why concurrency/parallelism matter and the pitfalls of lock-based
          mutable models.
        short: Hardware trends and application needs motivate concurrency; lock-based
          approaches are error-prone (races, deadlocks).
        long: Concurrent programs model multiple observers or happening-together activities;
          parallel programs break work into concurrent pieces for speed. Reasons include
          multicore hardware, responsiveness, and independent tasks. The chapter explains
          why lock-based mutable models complicate reasoning and lead to common errors
          (race conditions, deadlocks), motivating Clojure's explicit reference models
          that minimize ad-hoc locking.
      entities:
      - key: other:locking_pitfalls_motivation
        kind: other
        summary:
          name: Locking pitfalls (motivation)
          oneliner: Locking complexity motivates alternative designs like STM and
            immutable values.
          short: Choosing what/where to lock is hard; mistakes cause corruption or
            deadlock.
          long: The text uses analogies (bank ledger, guards) to explain locking and
            defensive copying. It emphasizes the implementation-level difficulties
            of locks and motivates using functional code plus a small, explicit mutable
            layer to minimize these problems.
        fact_kind: null
        related_to:
        - type: related_to
          target_key: concept:concurrency_and_parallelism_and_locking_pitfalls
      related_to:
      - type: same_as
        target_key: concept:concurrency_and_parallelism_and_locking_pitfalls
      subtopics: []
    - key: subtopic:software_transactional_memory_stm_and_refs
      summary:
        name: Software Transactional Memory (STM) and Refs
        oneliner: 'Refs + STM: coordinated, synchronous updates via dosync; MVCC implementation;
          primitives ref-set, alter, commute; validators.'
        short: Refs are mutable reference cells participating in STM (dosync) implemented
          with MVCC. Use alter/ref-set/commute and supply :validator for consistency
          checks.
        long: 'Refs are reference cells that must be updated inside transactions (dosync).
          STM guarantees atomicity, consistency (validators), and isolation (ACI without
          durability). Implementation uses MVCC: each transaction has a point (timestamp)
          and works with in-transaction copies; conflicts cause retries. Primary operations:

          - ref-set: direct set (inside dosync).

          - alter: apply an update function to the current in-transaction value; preferred
          for non-commutative updates.

          - commute: optimized for commutative updates; STM can reorder/re-run commute
          calls without retrying the whole transaction.

          Validators (provided when creating refs) enforce invariants and abort transactions
          when violated.'
      entities:
      - key: fact:transactional_properties_aci
        kind: fact
        summary:
          name: Transactional properties (ACI)
          oneliner: STM provides atomicity, consistency (via validators), and isolation;
            not durable.
          short: Clojure STM provides ACI (no D/durability).
          long: 'Like database transactions, Clojure''s STM guarantees:

            - Atomic updates across multiple refs within a dosync.

            - Consistency via :validator functions attached to refs.

            - Isolation: running transactions don''t see partially completed changes
            from other transactions.

            Because Clojure''s STM is in-memory, it does not guarantee durability;
            using a database is required for durable transactions.'
        fact_kind: fact
        related_to:
        - type: depends_on
          target_key: concept:refs_and_software_transactional_memory
        - type: depends_on
          target_key: concept:software_transactional_memory_stm
      - key: example:chat_messages_example_alter_vs_commute
        kind: example
        summary:
          name: Chat messages example (alter vs commute)
          oneliner: Using a ref of a message list and updating it with alter or commute.
          short: add-message uses (dosync (alter messages conj msg)); commute variant
            shows trade-offs in reordering.
          long: 'A ref messages holds a list of Message records. To add a message:

            - Safe: (dosync (alter messages conj msg)) — alter reads and updates in
            one transactional step.

            - Optimized: (dosync (commute messages conj msg)) — commute allows reordering
            and retry avoidance; use only when ordering doesn''t matter (e.g., acceptable
            for chat because external latencies already reorder messages).

            The example shows why alter is the default and commute is a specialized
            optimization.'
        fact_kind: null
        related_to:
        - type: depends_on
          target_key: concept:refs_and_software_transactional_memory
        - type: depends_on
