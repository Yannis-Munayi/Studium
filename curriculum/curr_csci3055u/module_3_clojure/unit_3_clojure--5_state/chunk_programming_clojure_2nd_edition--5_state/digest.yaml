    - key: subtopic:atoms_uncoordinated_synchronous_updates
      summary:
        name: 'Atoms: Uncoordinated Synchronous Updates'
        oneliner: Atoms manage single-location synchronous updates without transactions;
          use reset! and swap!.
        short: Atoms are for uncoordinated updates to a single value; swap! applies
          a function (may retry), reset! sets directly; validators allowed.
        long: 'Atoms provide a lightweight mutable reference for a single value and
          do not participate in STM. Key operations:

          - reset!: set an atom to a new value immediately.

          - swap!: apply a function to the current value and set the result; may be
          retried on contention, so the function should be side-effect-free.

          Atoms accept :validator like refs.

          If you need to coordinate updates across multiple values, use refs; otherwise
          atoms are simpler and sufficient.'
      entities:
      - key: example:current_track_as_an_atom
        kind: example
        summary:
          name: Current-track as an atom
          oneliner: Store {:title :composer} map in an atom and update with swap!
            assoc to change only :title.
          short: (def current-track (atom {:title \"...\" :composer \"...\"})) then
            (swap! current-track assoc :title \"...\")
          long: Shows modeling multiple related pieces (title and composer) inside
            a single atom map so updates to both fields can be effected together with
            reset! or updated safely with swap!/assoc for modifying only one key without
            needing coordinated refs.
        fact_kind: null
        related_to:
        - type: depends_on
          target_key: concept:atoms
        - type: depends_on
          target_key: concept:swap_and_reset_atom_operations
      related_to:
      - type: same_as
        target_key: concept:atoms
