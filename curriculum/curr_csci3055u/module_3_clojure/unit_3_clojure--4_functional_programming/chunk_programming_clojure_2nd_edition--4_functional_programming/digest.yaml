  - key: concept:stack_overflow_jvm_stack_behavior
    introduced: true
    summary:
      name: stack overflow / JVM stack behavior
      oneliner: Recursive calls allocate JVM stack frames and can cause StackOverflowError;
        JVM lacks general TCO.
      short: The JVM represents function calls with stack frames; naive recursion
        can exhaust the stack leading to StackOverflowError, motivating recur/trampoline/laziness.
      long: The chapter emphasizes that each Clojure function call maps to JVM method
        calls that allocate stack frames; naive recursion (especially exponential
        or deep linear recursion) consumes stack proportional to recursion depth and
        triggers StackOverflowError. The JVM generally does not implement general
        tail-call optimization (TCO), so Clojure provides explicit recur for self-tail
        recursion, trampoline for mutual recursion, and lazy sequences to avoid deep
        recursion.
    note: Shown via stack-consuming-fibo and tail-fibo examples producing StackOverflowError;
      explains reasons and workarounds.
    status: used
