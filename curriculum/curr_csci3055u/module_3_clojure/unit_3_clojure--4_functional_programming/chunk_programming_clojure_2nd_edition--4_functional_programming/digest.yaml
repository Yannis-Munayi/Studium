    subtopics:
    - key: subtopic:recursion_and_jvm_constraints
      summary:
        name: Recursion and JVM constraints
        oneliner: Tail recursion limitations on the JVM and Clojure workarounds.
        short: The JVM lacks general TCO; use recur, trampoline, lazy-seq, or memoization
          to avoid stack overflow.
        long: 'Because the JVM does not provide general tail-call optimization, naive
          recursive algorithms can

          cause StackOverflowError. Clojure provides several remedies: converting
          mutual recursion into

          self-recursion when possible; using loop/recur for self tail recursion (explicit
          TCO); using trampoline

          to handle mutual recursion without stack growth; replacing recursion with
          laziness (lazy-seq); and

          using memoization to shortcut repeated computation.'
      entities:
      - key: example:tail_recursion_recur_and_loop
        kind: example
        summary:
          name: Tail recursion, recur, and loop
          oneliner: Use loop/recur to implement tail recursion that doesn't consume
            stack.
          short: 'Example: rewrite tail-recursive Fibonacci to use loop/recur so JVM
            stack is not consumed.'
          long: 'Tail recursion places the recursive call in tail position so it can
            be transformed into iteration.

            Clojure''s recur provides explicit self-recursion optimization when the
            recursive call is to the same function

            or loop point. For self-recursive tail cases, prefer recur; for mutual
            recursion, consider other techniques.'
        fact_kind: null
        related_to:
        - type: related_to
          target_key: concept:tail_recursion_and_tail_call_optimization_tco
      - key: example:trampoline_for_mutual_recursion
        kind: example
        summary:
          name: Trampoline for mutual recursion
          oneliner: trampoline repeatedly calls returned functions until a non-function
            value is produced.
          short: 'Mutually recursive functions return zero-arg functions (via #(...));
            trampoline drives the iteration to avoid stack growth.'
          long: 'Trampolining converts mutual recursive tail calls into a loop at
            the caller: functions return a thunk (zero-arg function)

            representing the next call; trampoline repeatedly invokes the returned
            thunks until a concrete (non-function) value is returned.

            This permits mutual recursion without consuming additional JVM stack frames.'
        fact_kind: null
        related_to:
        - type: same_as
          target_key: concept:trampoline
        - type: related_to
          target_key: concept:declare
        - type: related_to
          target_key: concept:letfn
      - key: example:memoization_and_sequences_hofstadter_f_m
        kind: example
        summary:
          name: Memoization and sequences (Hofstadter F/M)
          oneliner: Use memoize to cache mutually recursive results and expose sequences
            to prepopulate caches.
          short: Memoize mutually recursive Hofstadter male/female functions, then
            expose m-seq/f-seq so values are cached incrementally.
          long: 'The Hofstadter Male/Female sequences are mutually recursive by definition
            and expensive to compute naively.

            Memoization caches computed values (trading heap for time), making repeated
            calls fast. Further, exposing the sequences

            (m-seq and f-seq) and building them from lower indices ensures the memoization
            cache is populated progressively,

            avoiding stack blowup when accessing higher indices later.'
        fact_kind: null
        related_to:
        - type: related_to
          target_key: concept:hofstadter_male_female_sequences
        - type: same_as
          target_key: concept:memoization
      - key: other:stack_overflow_behavior_on_the_jvm
        kind: other
        summary:
          name: Stack overflow behavior on the JVM
          oneliner: Recursive calls allocate stack frames; deep recursion can trigger
            StackOverflowError.
          short: JVM represents calls with stack frames; absence of general TCO motivates
            recur/trampoline/lazy approaches.
          long: 'The JVM uses per-call stack frames; unbounded recursion grows the
            call stack and may cause StackOverflowError.

            Clojure''s design acknowledges this and offers recur (self-tail recursion),
            trampoline (mutual recursion), and lazy sequences

            to mitigate or avoid deep call chains.'
        fact_kind: null
        related_to:
        - type: same_as
          target_key: concept:stack_overflow_jvm_stack_behavior
