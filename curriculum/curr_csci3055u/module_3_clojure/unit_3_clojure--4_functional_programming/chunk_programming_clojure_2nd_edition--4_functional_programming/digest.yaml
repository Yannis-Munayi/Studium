    - key: subtopic:problem_decomposition_using_sequence_library
      summary:
        name: Problem decomposition using sequence library
        oneliner: Prefer composing sequence functions (partition, filter, count, partial)
          over manual loop/recur.
        short: 'Example: transform a sequence into overlapping pairs with partition
          and count matching runs using count-if/partial.'
        long: 'Rather than writing explicit loop/recur to inspect neighboring elements,
          transform the input using sequence-library functions.

          Example workflow: create adjacent pairs (partition 2 1), filter those pairs
          by a predicate (every? (= :h ...)), and count results (count or a composed
          count-if).

          This yields clearer, more general, and lazy solutions (count-runs, count-heads-pairs).'
      entities:
      - key: example:by_pairs_partition_count_runs_pattern
        kind: example
        summary:
          name: By-pairs → partition → count-runs pattern
          oneliner: 'Turn neighbor-aware problems into sequence transformations: partition
            + filter + count.'
          short: Use partition with step 1 to make overlapping windows, then apply
            every?/filter and count (or count-if via comp).
          long: 'The pattern shows rule 5 & 6 in action: subdivide the problem (create
            pairs/windows) and use the existing sequence library

            to express the core predicate and aggregation. This avoids explicit recursion
            and yields concise, reusable functions (e.g., count-runs).'
        fact_kind: null
        related_to:
        - type: related_to
          target_key: concept:six_rules_of_clojure_fp
      related_to:
      - type: related_to
        target_key: concept:lazy_seq
      - type: depends_on
        target_key: concept:six_rules_of_clojure_fp
      subtopics: []
    - key: subtopic:language_constructs_and_patterns_used
      summary:
        name: Language constructs and patterns used
        oneliner: letfn, declare, multimethods, lazy-seq, memoize, partial — how they
          appear in idioms and examples.
        short: Local mutually recursive functions (letfn), pre-declaration (declare),
          multimethod dispatch for collection vs scalar handling, lazy-seq to break
          recursion, memoize to cache expensive computations, and partial/curry-like
          idioms.
        long: 'This topic groups the implementation-level constructs illustrated in
          examples:

          - letfn: local functions that can be mutually recursive.

          - declare: predeclare top-level names to allow mutual top-level defs.

          - multimethods: dispatch on whether an item is a collection or scalar (used
          to simplify replace-symbol).

          - lazy-seq: break recursive generators and produce infinite sequences.

          - memoize: cache function results to speed up mutually recursive sequences
          (Hofstadter F/M).

          - partial: create specialized functions (e.g., count-heads-pairs) from general
          ones.

          These constructs are combined to balance clarity, laziness, and JVM realities.'
      entities:
      - key: definition:letfn_and_declare_usage
        kind: definition
        summary:
          name: letfn and declare usage
          oneliner: letfn defines local mutually referential functions; declare creates
            top-level var names for mutual defs.
          short: letfn allows local functions to call each other; declare pre-creates
            var names so later defn forms can mutually reference each other.
          long: 'letfn is used when mutually recursive helper functions are local
            to an enclosing function.

            declare is used at top-level when two or more defn forms must refer to
            each other; it creates the var names without bindings

            so subsequent defn forms can populate them. Both are tools to express
            mutual recursion while managing scope appropriately.'
        fact_kind: null
        related_to:
        - type: same_as
          target_key: concept:letfn
        - type: same_as
          target_key: concept:declare
      - key: other:multimethod_refactor_for_replace_symbol
        kind: other
        summary:
          name: Multimethod refactor for replace-symbol
          oneliner: Replace explicit symbol/list branching with a defmulti/defmethod
            dispatch on coll? to improve clarity.
          short: Use a multimethod that dispatches on whether the input is a collection
            or a scalar, and break recursion with lazy-seq for deep nesting.
          long: 'Converting a literal mutual-recursive pair of functions into a single
            multimethod (dispatching on coll?),

            and wrapping recursive branches in lazy-seq, simplifies the code and prevents
            stack overflow for deeply nested s-lists.'
        fact_kind: null
        related_to:
        - type: related_to
          target_key: concept:multimethods
        - type: depends_on
          target_key: concept:lazy_seq
      related_to:
