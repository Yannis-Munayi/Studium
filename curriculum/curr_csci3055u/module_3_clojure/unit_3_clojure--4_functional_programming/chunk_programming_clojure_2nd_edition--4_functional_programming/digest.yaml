  - key: concept:printing_limits_print_length_and_print_level
    introduced: true
    summary:
      name: printing limits *print-length* and *print-level*
      oneliner: Printer controls to limit how much of collections and nesting are
        printed.
      short: '*print-length* limits number of items printed in collections; *print-level*
        limits nested printing depth to avoid overwhelming the REPL/printer.'
      long: 'Clojure exposes dynamic vars to control the REPL printer: *print-length*
        restricts how many items of a collection are printed (truncating with an ellipsis),
        preventing accidental realization of huge lazy sequences at the REPL; *print-level*
        limits the depth of nested structure printed (printing # when exceeding limit).
        The chapter uses these to safely inspect large or deeply nested sequences.'
    note: 'Examples: (set! *print-length* 10) to avoid printing a billion fibs; (set!
      *print-level* 25) to limit nested deeply-nested output.'
    status: used
  topics:
  - key: topic:functional_programming_in_clojure
    summary:
      name: Functional Programming in Clojure
      oneliner: Overview of FP principles, benefits, and Clojure-specific rules and
        idioms.
      short: Pure functions, referential transparency, immutability via persistent
        structures, and practical rules for recursion and laziness in Clojure.
      long: 'This topic groups the chapter''s high-level functional-programming concepts
        as applied in Clojure.

        It emphasizes writing pure functions (no side effects), the advantages of
        referential transparency

        (laziness, memoization, parallelization), and immutable persistent data structures
        that rely on

        structural sharing. The chapter presents practical "Six Rules of Clojure FP"
        guiding when to use

        recur, when to prefer lazy sequences, and when to leverage the sequence library
        to avoid explicit

        recursion. It also explains JVM constraints (lack of general TCO) and the
        resulting pragmatic

        techniques Clojure provides (loop/recur, lazy-seq, trampoline, memoization).'
    entities:
    - key: definition:pure_functions
      kind: definition
      summary:
        name: Pure functions
        oneliner: Functions without side effects that depend only on arguments.
        short: Functions whose behavior is determined solely by their arguments and
          which produce no side effects.
        long: 'Pure functions are central to FP and enable reasoning, testing, and
          laziness.

          They are referentially transparent: a call can be replaced by its result
          without changing program behavior.'
      fact_kind: null
      related_to:
      - type: same_as
        target_key: concept:pure_functions
      - type: depends_on
        target_key: concept:referential_transparency
    - key: definition:persistent_immutable_data_structures
      kind: definition
      summary:
        name: Persistent immutable data structures
        oneliner: Immutable collections that share structure between versions.
        short: Clojure's collections are immutable but persistent, reusing unchanged
          parts efficiently.
        long: 'Persistent data structures allow ''updates'' to produce new versions
          while sharing most internal structure

          with prior versions, avoiding naïve full-copy semantics and improving performance
          via structural sharing.'
      fact_kind: null
      related_to:
      - type: same_as
        target_key: concept:persistent_data_structures
      - type: part_of
        target_key: concept:structural_sharing
    - key: other:six_rules_of_clojure_fp
      kind: other
      summary:
        name: Six Rules of Clojure FP
        oneliner: Pragmatic guidelines for recursion, laziness, and using the sequence
          library.
        short: 'Guidelines: avoid direct recursion; use recur for scalars/small seqs;
          prefer lazy for large/variable seqs; don''t realize more than needed; know
          the sequence library; subdivide problems.'
        long: 'These six rules give actionable advice for writing efficient, idiomatic
          Clojure FP:

          1) Avoid direct (stack-consuming) recursion.

          2) Use recur for scalar results or fixed small sequences.

          3) For large/variable sequences, produce lazy sequences.

          4) Avoid realizing more of a lazy sequence than necessary.

          5) Know and prefer sequence-library functions.

          6) Subdivide problems to leverage sequence primitives.'
      fact_kind: null
      related_to:
      - type: same_as
        target_key: concept:six_rules_of_clojure_fp
