    - key: subtopic:laziness_and_sequences
      summary:
        name: Laziness and sequences
        oneliner: Creating and using lazy sequences to represent infinite/large data
          and to break recursion.
        short: Use lazy-seq, iterate, map, and other seq functions to build lazy pipelines;
          avoid holding a top-level head to prevent memory leaks.
        long: 'Lazy sequences delay computation until elements are needed (realization)
          and cache realized segments.

          Construct lazy sequences directly with lazy-seq or compose them using sequence-library
          functions (iterate, map, concat, partition).

          Prefer exposing lazy-producing functions rather than top-level vars holding
          realized heads to avoid retaining references

          and preventing GC (the "holding the head" problem). Control REPL printing
          with *print-length* and *print-level* to avoid accidental realization/display
          of huge or deeply nested sequences.'
      entities:
      - key: example:fibonacci_iterate_map_first_christophe_grand_s_version
        kind: example
        summary:
          name: 'Fibonacci: iterate + map first (Christophe Grand''s version)'
          oneliner: Build an infinite lazy Fibonacci sequence using iterate and map.
          short: fibo = (map first (iterate (fn [[a b]] [b (+ a b)]) [0 1])) — lazy,
            efficient, easy to consume with take/nth.
          long: 'By composing iterate (which produces an infinite lazy sequence of
            pairs) with map first,

            you obtain an infinite lazy sequence of Fibonacci numbers that realizes
            only the prefix you consume.

            This follows the chapter''s rule of preferring sequence-library functions
            over manual recursion.'
        fact_kind: null
        related_to:
        - type: depends_on
          target_key: concept:lazy_seq
      - key: fact:holding_the_head_prevents_gc
        kind: fact
        summary:
          name: Holding the head prevents GC
          oneliner: Top-level var referencing a sequence head retains realized elements
            and can cause OOM.
          short: Storing a lazy sequence in a top-level var that holds its head prevents
            collected realized elements, leading to memory growth.
          long: 'If a top-level var (or long-lived root) references the head of a
            lazy sequence, elements that have been realized remain reachable

            and cannot be garbage-collected. To avoid this, provide a function that
            returns a fresh lazy sequence, allowing callers to manage

            their own references and caches.'
        fact_kind: fact
        related_to:
        - type: same_as
          target_key: concept:holding_the_head_loss_of_laziness
      related_to:
      - type: same_as
        target_key: concept:lazy_seq
      - type: related_to
        target_key: concept:holding_the_head_loss_of_laziness
      - type: related_to
        target_key: concept:printing_limits_print_length_and_print_level
